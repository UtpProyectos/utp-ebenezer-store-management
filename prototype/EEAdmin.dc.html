<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:20px;max-width:1640px;margin:0 auto">
  <div style="display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:28px;background:#FFFFFF;flex-wrap:wrap">
    <span style="width:44px;height:44px;flex:none;border-radius:50%;background:#F2F2F2;color:#111111;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:22px;line-height:1">info</span>
    <span style="flex:1 1 280px;font:500 17px/1.45 'Plus Jakarta Sans';color:#3A3A3A;text-wrap:pretty">Aquí se cambian los datos de la tienda. Para vender, registrar mercadería o revisar el stock no necesitas entrar aquí.</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px">
    <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
      <button onClick="{{ t.go }}" style="display:flex;flex-direction:column;gap:22px;padding:22px;border-radius:32px;border:none;background:#FFFFFF;color:#111111;text-align:left;cursor:pointer;transition:transform 160ms cubic-bezier(.23,1,.32,1),box-shadow 200ms ease" style-hover="box-shadow:0 14px 32px -18px rgba(17,17,17,.3)" style-active="transform:scale(.98)">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <span style="width:56px;height:56px;border-radius:50%;background:#F2F2F2;color:#DE6B4E;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:26px;line-height:1;font-variation-settings:'FILL' 1">{{ t.icon }}</span>
          <span style="padding:8px 14px;border-radius:999px;background:#F5F5F5;font:600 15px 'Plus Jakarta Sans';color:#3A3A3A">{{ t.count }}</span>
        </div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px">
          <span style="display:flex;flex-direction:column;gap:4px"><span style="font:700 22px 'Plus Jakarta Sans'">{{ t.title }}</span><span style="font:500 16px/1.4 'Plus Jakarta Sans';color:#6B6B6B">{{ t.desc }}</span></span>
          <span style="width:44px;height:44px;flex:none;border-radius:50%;background:#111111;color:#FFFFFF;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:22px;line-height:1">arrow_forward</span>
        </div>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const d = this.props.d, P = this.props.products || [], nav = this.props.nav || (() => {});
    if (!d) return {};
    const T = [
      ['productos', 'Productos', 'Precios, códigos y datos completos', 'shopping_basket', `${P.length} productos`],
      ['categorias', 'Categorías', 'Grupos para ordenar lo que vendes', 'sell', `${d.categories.length} categorías`],
      ['proveedores', 'Proveedores', 'A quién le compras y sus teléfonos', 'handshake', `${d.providers.length} proveedores`],
      ['usuarios', 'Usuarios', 'Quién entra al sistema y con qué rol', 'group', `${d.users.length} usuarios`],
      ['historiales', 'Historiales', 'Ventas, ingresos, movimientos y consumo', 'history', 'Reportes'],
      ['config', 'Configuración', 'Nombre de la tienda, moneda y avisos', 'tune', 'General'],
    ];
    return { tiles: T.map(([id, title, desc, icon, count]) => ({ title, desc, icon, count, go: () => nav(id) })) };
  }
}
</script>
</body>
</html>
