<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:16px;max-width:1640px;margin:0 auto">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div role="tablist" style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{ t.on }}" onClick="{{ t.go }}" style="display:flex;align-items:center;gap:8px;height:48px;padding:0 18px;border-radius:999px;border:none;background:{{ t.bg }};color:{{ t.fg }};font:600 16px 'Plus Jakarta Sans';cursor:pointer;transition:background-color 160ms ease,color 160ms ease,transform 140ms cubic-bezier(.23,1,.32,1)" style-active="transform:scale(.97)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">{{ t.icon }}</span>{{ t.label }}</button>
      </sc-for>
    </div>
    <div style="display:flex;gap:4px;padding:4px;border-radius:999px;background:#FFFFFF">
      <sc-for list="{{ periods }}" as="p" hint-placeholder-count="3">
        <button onClick="{{ p.go }}" style="height:40px;padding:0 16px;border-radius:999px;border:none;background:{{ p.bg }};color:{{ p.fg }};font:600 15px 'Plus Jakarta Sans';cursor:pointer;transition:background-color 160ms ease,color 160ms ease">{{ p.label }}</button>
      </sc-for>
    </div>
  </div>

  <section style="display:flex;flex-direction:column;padding:12px 0 8px;background:#FFFFFF;border-radius:28px;overflow:hidden">
    <div style="display:flex;align-items:center;gap:14px;padding:8px 18px 4px 22px;flex-wrap:wrap">
      <span style="flex:1;min-width:0;font:700 20px 'Plus Jakarta Sans'">{{ cur.title }}</span>
      <span style="font:700 22px/1 'Plus Jakarta Sans';font-variant-numeric:tabular-nums">{{ cur.total }}</span>
      <button onClick="{{ print }}" aria-label="Imprimir" title="Imprimir" style="width:44px;height:44px;border-radius:50%;border:none;background:#F2F2F2;color:#111111;display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:20px;line-height:1;cursor:pointer" style-hover="background:#E9E9E9" style-active="transform:scale(.95)">print</button>
    </div>
    <sc-if value="{{ showHead }}">
      <div style="display:grid;grid-template-columns:{{ cols }};gap:14px;padding:16px 18px 10px;font:500 14px 'Plus Jakarta Sans';color:#6B6B6B">
        <sc-for list="{{ heads }}" as="h"><span style="text-align:{{ h.align }}">{{ h.label }}</span></sc-for>
      </div>
    </sc-if>
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
      <div style="display:grid;grid-template-columns:{{ cols }};gap:14px;align-items:center;padding:12px 18px;border-bottom:1px solid #F5F5F5;background:#FFFFFF;animation:eeIn 200ms cubic-bezier(.23,1,.32,1)">
        <span style="font:500 15px 'Plus Jakarta Sans';color:#6B6B6B;font-variant-numeric:tabular-nums">{{ r.date }}</span>
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font:600 16px/1.3 'Plus Jakarta Sans'">{{ r.main }}</span><sc-if value="{{ r.hasSub }}"><span style="font:500 14px 'Plus Jakarta Sans';color:#9A9A9A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.sub }}</span></sc-if></div>
        <sc-if value="{{ showHead }}"><span style="justify-self:start;font:500 15px 'Plus Jakarta Sans';color:{{ r.tagFg }}">{{ r.tag }}</span></sc-if>
        <span style="font:600 16px 'Plus Jakarta Sans';text-align:right;font-variant-numeric:tabular-nums;color:{{ r.amtFg }}">{{ r.amt }}</span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { tab: 'ventas', period: 'semana' };
  renderVals() {
    const d = this.props.d, toast = this.props.toast || (() => {});
    if (!d) return {};
    const s = this.state, narrow = this.props.narrow;
    const sales = [
      ['Hoy 11:42', '#1038', 'Luis Huamán', 'Efectivo', 18.5], ['Hoy 10:31', '#1037', 'Luis Huamán', 'Yape', 6.8], ['Hoy 09:12', '#1036', 'Rosa Quispe', 'Efectivo', 32.4],
      ['Hoy 08:05', '#1035', 'Rosa Quispe', 'Efectivo', 12.0], ['28 sep', '#1034', 'Luis Huamán', 'Tarjeta', 54.9], ['28 sep', '#1033', 'Rosa Quispe', 'Efectivo', 9.5],
    ];
    const tag = (label, bg, fg) => ({ tag: label, tagBg: bg, tagFg: fg });
    const TABS = {
      ventas: { label: 'Ventas', icon: 'point_of_sale', title: 'Historial de ventas', hint: 'Cada venta cobrada en caja', totalLabel: 'vendido',
        heads: ['Fecha', 'Venta', 'Pago', 'Total'],
        rows: (this.props.sales ? this.props.sales.map(x => ['Hoy ' + x.time, '#' + x.id, x.items, x.pay, x.total]).concat(sales.slice(4)) : sales).map(([date, n, who, pay, amt]) => ({ date, main: n, sub: /^[A-ZÁÉÍÓÚ][a-záéíóú]+ [A-ZÁÉÍÓÚ][a-záéíóú]+$/.test(who) ? '' : who, ...tag(pay, '#FFFFFF', '#6B6B6B'), amt: d.money(amt), amtFg: '#111111', v: amt })) },
      ingresos: { label: 'Ingresos', icon: 'local_shipping', title: 'Historial de ingresos', hint: 'Mercadería que llegó a la tienda', totalLabel: 'pagado',
        heads: ['Fecha', 'Producto', 'Proveedor', 'Pagaste'],
        rows: d.purchases.map(p => ({ date: p.date, main: p.prod, sub: `${p.qty} · lote ${p.lote}`, ...tag(p.prov.split(' ')[0], '#FFFFFF', '#6B6B6B'), amt: d.money(p.total), amtFg: '#111111', v: p.total })) },
      movimientos: { label: 'Movimientos', icon: 'swap_vert', title: 'Movimientos de inventario', hint: 'Entradas y salidas de productos', totalLabel: 'movimientos',
        heads: ['Fecha', 'Producto', 'Tipo', 'Cantidad'],
        rows: [
          ...(this.props.audit || []).map(a => ({ date: a.date, main: a.main, sub: a.sub, ...tag(a.kind === 'delete' ? 'Eliminación' : a.kind === 'create' ? 'Venta manual' : a.kind === 'retire' ? 'Retiro' : 'Edición', a.kind === 'delete' ? '#FDE7EA' : a.kind === 'create' ? '#E4F3EA' : '#FFF1D9', a.kind === 'delete' ? '#E5383B' : a.kind === 'create' ? '#1E6A40' : '#8A5200'), amt: 'Auditoría', amtFg: '#6B6B6B' })),
          ...d.purchases.slice(0, 3).map(p => ({ date: p.date, main: p.prod, sub: 'Ingreso de mercadería', ...tag('Entrada', '#E4F3EA', '#1E6A40'), amt: '+' + p.qty.split(' ')[0], amtFg: '#1E6A40' })),
          ...d.consumos.slice(0, 2).map(c => ({ date: c.date, main: c.prod, sub: c.reason, ...tag('Consumo interno', '#F1ECFF', '#5B3FC4'), amt: '−' + c.qty, amtFg: '#E5383B' })),
          { date: 'Hoy 11:42', main: 'Gaseosa cola 500 ml', sub: 'Venta #1038', ...tag('Venta', '#FBEDE8', '#A94429'), amt: '−3', amtFg: '#E5383B' },
        ] },
      consumo: { label: 'Consumo interno', icon: 'output', title: 'Consumo interno', hint: 'Bajó el stock, pero no entró dinero a caja', totalLabel: 'costo',
        heads: ['Fecha', 'Producto', 'Motivo', 'Costo'],
        rows: d.consumos.map(c => ({ date: c.date, main: `${c.prod} ×${c.qty}`, sub: c.who, ...tag(c.reason, '#FFFFFF', '#6B6B6B'), amt: d.money(c.cost), amtFg: '#111111', v: c.cost })) },
    };
    const cur = TABS[s.tab];
    const total = s.tab === 'movimientos' ? String(cur.rows.length) : d.money(cur.rows.reduce((a, r) => a + (r.v || 0), 0));
    const aligns = ['left', 'left', 'left', 'right'];
    return {
      tabs: Object.entries(TABS).map(([k, t]) => { const on = s.tab === k; return { label: t.label, icon: t.icon, on, go: () => this.setState({ tab: k }), bg: on ? '#A78BFA' : '#FFFFFF', fg: on ? '#FFFFFF' : '#111111' }; }),
      periods: [['hoy', 'Hoy'], ['semana', 'Esta semana'], ['mes', 'Este mes']].map(([k, label]) => { const on = s.period === k; return { label, go: () => this.setState({ period: k }), bg: on ? '#111111' : 'transparent', fg: on ? '#FFFFFF' : '#3A3A3A' }; }),
      cur: { ...cur, total }, rows: cur.rows.map(r => ({ ...r, hasSub: !!r.sub })), showHead: !narrow,
      heads: cur.heads.map((label, i) => ({ label, align: aligns[i] })),
      cols: narrow ? '76px minmax(0,1fr) auto' : '110px minmax(0,2fr) minmax(0,1fr) 120px',
      print: () => toast('Preparando historial para imprimir…', 'info'),
    };
  }
}
</script>
</body>
</html>
