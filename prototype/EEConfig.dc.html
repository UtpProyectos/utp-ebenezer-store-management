<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:16px;max-width:880px;margin:0 auto">
  <section style="background:#FFFFFF;border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:3px"><h3 style="margin:0;font:700 19px 'Plus Jakarta Sans'">Tamaño de letra</h3><span style="font:500 15px 'Plus Jakarta Sans';color:#6B6B6B">Se guarda en esta caja. Elige el que te resulte más cómodo de leer.</span></div>
    <div role="radiogroup" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px">
      <sc-for list="{{ sizes }}" as="z" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{ z.on }}" onClick="{{ z.go }}" style="display:flex;align-items:center;gap:12px;height:64px;padding:0 16px 0 8px;border-radius:999px;border:none;background:{{ z.bg }};color:{{ z.fg }};cursor:pointer;transition:background-color 160ms ease,color 160ms ease,transform 140ms cubic-bezier(.23,1,.32,1)" style-active="transform:scale(.97)"><span style="width:48px;height:48px;flex:none;border-radius:50%;background:{{ z.dotBg }};color:{{ z.dotFg }};display:grid;place-items:center;font:700 {{ z.px }} 'Plus Jakarta Sans'">Aa</span><span style="font:600 16px 'Plus Jakarta Sans'">{{ z.label }}</span></button>
      </sc-for>
    </div>
  </section>
  <section style="background:#fff;border:1px solid #FFFFFF;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:3px"><h3 style="margin:0;font:700 19px 'Plus Jakarta Sans'">Datos del negocio</h3><span style="font:500 15px 'Plus Jakarta Sans';color:#6B6B6B">Aparecen en tickets y reportes.</span></div>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <div style="width:72px;height:72px;border-radius:26px;background:#DE6B4E;color:#FFFFFF;display:grid;place-items:center;font:800 26px 'Plus Jakarta Sans',sans-serif">EE</div>
      <div style="display:flex;flex-direction:column;gap:6px"><span style="font:600 16px 'Plus Jakarta Sans'">Logo</span><div style="display:flex;gap:8px"><button onClick="{{ changed }}" style="height:44px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;background:#fff;font:600 15px 'Plus Jakarta Sans';cursor:pointer" style-hover="background:#F5F5F5">Subir imagen</button><button style="height:44px;padding:0 12px;border-radius:999px;border:none;background:transparent;color:#6B6B6B;font:600 15px 'Plus Jakarta Sans';cursor:pointer" style-hover="background:#EFEFEF">Quitar</button></div><span style="font:500 14px 'Plus Jakarta Sans';color:#6B6B6B">PNG o JPG, cuadrado, mínimo 256 px.</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Nombre del negocio</span><input value="{{ name }}" onChange="{{ onName }}" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">RUC <span style="font-weight:500;color:#6B6B6B">(opcional)</span></span><input onChange="{{ changed }}" placeholder="10XXXXXXXXX" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Dirección</span><input onChange="{{ changed }}" value="Jr. Las Magnolias 245, Los Olivos" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Teléfono</span><input onChange="{{ changed }}" value="987 120 455" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Moneda</span><select onChange="{{ changed }}" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;background:#fff;font:500 17px 'Plus Jakarta Sans'"><option>Sol peruano (S/)</option><option>Dólar (US$)</option></select></label>
    </div>
  </section>

  <section style="background:#fff;border:1px solid #FFFFFF;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:3px"><h3 style="margin:0;font:700 19px 'Plus Jakarta Sans'">Inventario</h3><span style="font:500 15px 'Plus Jakarta Sans';color:#6B6B6B">Valores que se usan al crear productos nuevos.</span></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Stock mínimo predeterminado</span><div style="display:flex;align-items:center;gap:8px"><input value="{{ minStock }}" onChange="{{ onMin }}" inputmode="numeric" style="width:100px;height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:600 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input><span style="font:500 16px 'Plus Jakarta Sans';color:#6B6B6B">unidades</span></div></label>
      <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Avisar vencimiento con</span><div style="display:flex;align-items:center;gap:8px"><input value="{{ expDays }}" onChange="{{ onExp }}" inputmode="numeric" style="width:100px;height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:600 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input><span style="font:500 16px 'Plus Jakarta Sans';color:#6B6B6B">días de anticipación</span></div></label>
    </div>
  </section>

  <section style="background:#fff;border:1px solid #FFFFFF;border-radius:26px;padding:8px 20px">
    <sc-for list="{{ toggles }}" as="t" hint-placeholder-count="4">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid {{ t.line }}">
        <div style="display:flex;flex-direction:column;gap:2px"><span style="font:600 16px 'Plus Jakarta Sans'">{{ t.label }}</span><span style="font:500 15px 'Plus Jakarta Sans';color:#6B6B6B">{{ t.desc }}</span></div>
        <button onClick="{{ t.go }}" role="switch" aria-checked="{{ t.on }}" aria-label="{{ t.label }}" style="position:relative;flex:none;width:44px;height:26px;border-radius:999px;border:none;background:{{ t.track }};cursor:pointer;transition:background-color 180ms ease"><span style="position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transform:{{ t.knob }};transition:transform 180ms cubic-bezier(.23,1,.32,1)"></span></button>
      </div>
    </sc-for>
  </section>

  <sc-if value="{{ dirty }}">
    <div style="position:sticky;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 18px;border-radius:24px;background:#DE6B4E;color:#fff;box-shadow:0 16px 40px -10px rgba(17,17,17,.5);animation:eeToast 240ms cubic-bezier(.23,1,.32,1)">
      <span style="font:600 16px 'Plus Jakarta Sans'">Tienes cambios sin guardar</span>
      <div style="display:flex;gap:8px"><button onClick="{{ discard }}" style="height:46px;padding:0 12px;border-radius:999px;border:none;background:rgba(255,255,255,.08);color:#fff;font:600 15px 'Plus Jakarta Sans';cursor:pointer" style-hover="background:rgba(255,255,255,.14)">Descartar</button><button onClick="{{ save }}" style="height:46px;padding:0 16px;border-radius:999px;border:none;background:#DE6B4E;color:#FFFFFF;font:700 15px 'Plus Jakarta Sans';cursor:pointer" style-active="transform:scale(.97)">Guardar cambios</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: 'Bodega Eben-Ezer', minStock: '10', expDays: '10', t: { crit: true, exp: true, daily: false, ticket: true }, dirty: false };
  renderVals() {
    const s = this.state, toast = this.props.toast || (() => {});
    const defs = [['crit', 'Alertas de stock crítico', 'Notificar cuando un producto baja a la mitad de su mínimo.'], ['exp', 'Alertas de vencimiento', 'Notificar productos próximos a vencer y vencidos.'], ['ticket', 'Imprimir ticket automáticamente', 'Al confirmar cada venta.']];
    const cur = this.props.textSize || 'Normal', setT = this.props.setTextSize || (() => {});
    return {
      sizes: [['Pequeño', '12px'], ['Normal', '15px'], ['Grande', '19px'], ['Muy grande', '23px']].map(([label, px]) => { const on = cur === label; return { label, px, on, go: () => { setT(label); toast('Tamaño de letra: ' + label); }, bg: on ? '#111111' : '#F5F5F5', fg: on ? '#FFFFFF' : '#111111', dotBg: on ? '#DE6B4E' : '#FFFFFF', dotFg: on ? '#FFFFFF' : '#111111' }; }),
      name: s.name, onName: e => this.setState({ name: e.target.value, dirty: true }), changed: () => this.setState({ dirty: true }),
      minStock: s.minStock, onMin: e => this.setState({ minStock: e.target.value.replace(/\D/g, ''), dirty: true }),
      expDays: s.expDays, onExp: e => this.setState({ expDays: e.target.value.replace(/\D/g, ''), dirty: true }),
      toggles: defs.map(([k, label, desc], i) => { const on = s.t[k]; return { label, desc, on, line: i === defs.length - 1 ? 'transparent' : '#EFEFEF', track: on ? '#DE6B4E' : '#D0D0D0', knob: on ? 'translateX(18px)' : 'none', go: () => this.setState(x => ({ t: { ...x.t, [k]: !on }, dirty: true })) }; }),
      dirty: s.dirty, discard: () => this.setState({ dirty: false }), save: () => { this.setState({ dirty: false }); toast('Configuración guardada'); },
    };
  }
}
</script>
</body>
</html>
