<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:16px;max-width:1640px;margin:0 auto">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <p style="margin:0;font:500 16px 'Plus Jakarta Sans';color:#6B6B6B">{{ summary }}</p>
    <button onClick="{{ openNew }}" style="display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 18px;border-radius:999px;border:none;background:#DE6B4E;color:#fff;font:600 16px 'Plus Jakarta Sans';cursor:pointer" style-hover="background:#C85A3F" style-active="transform:scale(.97)"><span style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">add</span>Nueva categoría</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="8">
      <div style="display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:26px;background:#fff;border:1px solid #FFFFFF;opacity:{{ c.op }};transition:opacity 200ms ease,border-color 150ms ease" style-hover="border-color:#D4D4D4">
        <div style="display:flex;align-items:flex-start;gap:12px">
          <span style="width:44px;height:44px;flex:none;border-radius:18px;background:{{ c.iconBg }};color:{{ c.iconFg }};display:grid;place-items:center;font-family:'Material Symbols Rounded';font-size:23px;line-height:1">{{ c.icon }}</span>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font:700 18px 'Plus Jakarta Sans'">{{ c.name }}</span><span style="font:500 15px/1.4 'Plus Jakarta Sans';color:#6B6B6B">{{ c.desc }}</span></div>
          <button onClick="{{ c.edit }}" title="Editar" style="width:32px;height:32px;border-radius:999px;border:none;background:transparent;cursor:pointer;color:#6B6B6B;display:grid;place-items:center" style-hover="background:#EFEFEF"><span style="font-family:'Material Symbols Rounded';font-size:22px;line-height:1">edit</span></button>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #F2F2F2">
          <span style="font:600 15px 'Plus Jakarta Sans';color:#3A3A3A">{{ c.countL }}</span>
          <button onClick="{{ c.toggle }}" role="switch" aria-checked="{{ c.active }}" style="display:flex;align-items:center;gap:8px;border:none;background:transparent;cursor:pointer;font:600 14px 'Plus Jakarta Sans';color:{{ c.stFg }}">{{ c.stLabel }}<span style="position:relative;width:36px;height:22px;border-radius:999px;background:{{ c.track }};transition:background-color 180ms ease"><span style="position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transform:{{ c.knob }};transition:transform 180ms cubic-bezier(.23,1,.32,1)"></span></span></button>
        </div>
      </div>
    </sc-for>
  </div>
  <sc-if value="{{ modal }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:70;background:rgba(17,17,17,.45);display:grid;place-items:center;padding:16px;animation:eeFade 180ms ease">
      <div onClick="{{ stop }}" role="dialog" aria-modal="true" style="width:100%;max-width:420px;background:#fff;border-radius:28px;box-shadow:0 30px 60px -20px rgba(17,17,17,.45);animation:eePop 220ms cubic-bezier(.23,1,.32,1);overflow:hidden">
        <div style="padding:20px 22px 4px"><h3 style="margin:0;font:700 20px 'Plus Jakarta Sans',sans-serif">{{ modalTitle }}</h3></div>
        <div style="padding:14px 22px 20px;display:flex;flex-direction:column;gap:14px">
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Nombre</span><input value="{{ fName }}" onChange="{{ onName }}" placeholder="Ej. Congelados" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid {{ nameBorder }};font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input><sc-if value="{{ nameErr }}"><span style="font:500 14px 'Plus Jakarta Sans';color:#E5383B">Escribe un nombre para la categoría.</span></sc-if></label>
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font:600 15px 'Plus Jakarta Sans'">Descripción</span><input value="{{ fDesc }}" onChange="{{ onDesc }}" placeholder="Opcional" style="height:50px;padding:0 12px;border-radius:999px;border:1px solid #DADADA;font:500 17px 'Plus Jakarta Sans';outline:none" style-focus="border-color:#DE6B4E;box-shadow:0 0 0 3px rgba(222,107,78,.18)"></input></label>
        </div>
        <div style="display:flex;gap:10px;padding:14px 22px;background:#FAFAFA;border-top:1px solid #F2F2F2">
          <button onClick="{{ close }}" style="flex:1;height:44px;border-radius:999px;border:1px solid #DADADA;background:#fff;font:600 16px 'Plus Jakarta Sans';cursor:pointer">Cancelar</button>
          <button onClick="{{ save }}" style="flex:1;height:44px;border-radius:999px;border:none;background:#DE6B4E;color:#fff;font:600 16px 'Plus Jakarta Sans';cursor:pointer" style-active="transform:scale(.97)">Guardar</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cats: null, modal: null, fName: '', fDesc: '', tried: false };
  renderVals() {
    const d = this.props.d, P = this.props.products || [], toast = this.props.toast || (() => {});
    if (!d) return {};
    const s = this.state, cats = s.cats || d.categories;
    const setCats = c => this.setState({ cats: c });
    return {
      summary: `${cats.filter(c => c.active).length} categorías activas · ${P.length} productos`,
      openNew: () => this.setState({ modal: 'new', fName: '', fDesc: '', tried: false }),
      cats: cats.map((c, i) => { const n = P.filter(p => p.cat === c.name).length; return {
        ...c, countL: n ? `${n} producto${n > 1 ? 's' : ''}` : 'Sin productos', op: c.active ? 1 : 0.6,
        iconBg: c.active ? '#EFEFEF' : '#EFEFEF', iconFg: c.active ? '#111111' : '#8A8A8A',
        stLabel: c.active ? 'Activa' : 'Inactiva', stFg: c.active ? '#1E6A40' : '#8A8A8A', track: c.active ? '#DE6B4E' : '#D0D0D0', knob: c.active ? 'translateX(14px)' : 'none',
        toggle: () => { setCats(cats.map((x, j) => j === i ? { ...x, active: !x.active } : x)); toast(`Categoría ${c.name} ${c.active ? 'desactivada' : 'activada'}`, 'info'); },
        edit: () => this.setState({ modal: i, fName: c.name, fDesc: c.desc, tried: false }),
      }; }),
      modal: s.modal !== null, modalTitle: s.modal === 'new' ? 'Nueva categoría' : 'Editar categoría',
      fName: s.fName, fDesc: s.fDesc, onName: e => this.setState({ fName: e.target.value }), onDesc: e => this.setState({ fDesc: e.target.value }),
      nameErr: s.tried && !s.fName.trim(), nameBorder: s.tried && !s.fName.trim() ? '#EF3E42' : '#DADADA',
      close: () => this.setState({ modal: null }), stop: e => e.stopPropagation(),
      save: () => {
        if (!s.fName.trim()) { this.setState({ tried: true }); return; }
        if (s.modal === 'new') setCats([...cats, { name: s.fName.trim(), desc: s.fDesc || 'Sin descripción', icon: 'label', active: true }]);
        else setCats(cats.map((x, j) => j === s.modal ? { ...x, name: s.fName.trim(), desc: s.fDesc } : x));
        this.setState({ modal: null }); toast('Categoría guardada');
      },
    };
  }
}
</script>
</body>
</html>
