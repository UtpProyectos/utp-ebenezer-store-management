spring:
  application:
    name: ebenezer-backend

  # Loads local variables from backend/.env (never committed). Real environment variables take precedence.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Pings idle connections periodically so they are alive when a request borrows them
      # (see aliveBypassWindowMs in EbenezerBackendApplication).
      keepalive-time: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: ${JPA_SHOW_SQL:true}
        # Loads lazy associations in batches (IN queries) instead of one query per entity.
        default_batch_fetch_size: 50
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  # PORT is injected by Render; SERVER_PORT is the local override.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-stacktrace: never
    include-message: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # Initial admin, created on startup only when the users table is empty.
  bootstrap:
    admin:
      name: ${ADMIN_NAME:Administrator}
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:}
  demo-catalog:
    enabled: ${DEMO_CATALOG_ENABLED:false}
