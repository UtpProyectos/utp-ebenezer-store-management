name: Backend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

  push:
    branches:
      - develop
      - main
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Validate Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # The Spring context test needs a real PostgreSQL (the .env file is never committed).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ebenezer_test
          POSTGRES_USER: ebenezer
          POSTGRES_PASSWORD: ebenezer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ebenezer -d ebenezer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/ebenezer_test
      DB_USERNAME: ebenezer
      DB_PASSWORD: ebenezer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw -B clean verify

  # Render builds the service from backend/Dockerfile, so a broken image must fail CI before it reaches main.
  docker-build:
    name: Validate Docker image (Render)
    runs-on: ubuntu-latest
    needs: backend-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
